name: Build and Release NOEMA TV Speed Limiter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37.0 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build installable release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk NOEMA-TV-Speed-Limiter-1.0-Final02.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noema-tv-speed-limiter-1.0-final02
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0-final02 >/dev/null 2>&1 || \
            gh release create v1.0-final02 \
              --title "NOEMA TV Speed Limiter 1.0 Final 02" \
              --notes "Android TV bandwidth limiter with 2, 4 and 6 Mbit/s profiles, Full Speed mode, built-in diagnostics, Android 9 TCP fix, final launcher icon and TV banner. Install the APK directly on Android TV / Xiaomi TV Stick."
          gh release upload v1.0-final02 NOEMA-TV-Speed-Limiter-1.0-Final02.apk --clobber
