name: Validate NOEMA Android TV / Google Play build

on:
  push:
    branches:
      - main
      - play-store-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NOEMA_UPLOAD_KEYSTORE_B64: ${{ secrets.NOEMA_UPLOAD_KEYSTORE_B64 }}
  NOEMA_KEYSTORE_PASSWORD: ${{ secrets.NOEMA_KEYSTORE_PASSWORD }}
  NOEMA_KEY_ALIAS: ${{ secrets.NOEMA_KEY_ALIAS }}
  NOEMA_KEY_PASSWORD: ${{ secrets.NOEMA_KEY_PASSWORD }}
  NOEMA_KEYSTORE_FILE: ${{ runner.temp }}/noema-upload.jks

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'

      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify Android TV home banner is 320x180
        run: python3 tools/verify-webp-size.py app/src/main/res/drawable-xhdpi/tv_banner_final.webp 320 180

      - name: Configure production upload signing when secrets exist
        if: env.NOEMA_UPLOAD_KEYSTORE_B64 != '' && env.NOEMA_KEYSTORE_PASSWORD != '' && env.NOEMA_KEY_ALIAS != '' && env.NOEMA_KEY_PASSWORD != ''
        run: |
          printf '%s' "$NOEMA_UPLOAD_KEYSTORE_B64" | base64 --decode > "$NOEMA_KEYSTORE_FILE"
          chmod 600 "$NOEMA_KEYSTORE_FILE"

      - name: Lint and build Android App Bundle
        run: gradle --no-daemon --stacktrace lintRelease bundleRelease assembleDebug

      - name: Verify 32/64-bit ABIs and 16 KB native alignment
        run: |
          READELF="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bash tools/verify-aab-native.sh app/build/outputs/bundle/release/app-release.aab "$READELF"

      - name: Verify production AAB signature
        if: env.NOEMA_UPLOAD_KEYSTORE_B64 != '' && env.NOEMA_KEYSTORE_PASSWORD != '' && env.NOEMA_KEY_ALIAS != '' && env.NOEMA_KEY_PASSWORD != ''
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Name Play bundle
        run: |
          if [[ -s "$NOEMA_KEYSTORE_FILE" ]]; then
            cp app/build/outputs/bundle/release/app-release.aab NOEMA-TV-Speed-Limiter-1.1.0-PLAY-SIGNED.aab
          else
            cp app/build/outputs/bundle/release/app-release.aab NOEMA-TV-Speed-Limiter-1.1.0-UNSIGNED.aab
          fi
          cp app/build/outputs/apk/debug/app-debug.apk NOEMA-TV-Speed-Limiter-1.1.0-DEBUG.apk

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: noema-play-bundle-1.1.0
          path: NOEMA-TV-Speed-Limiter-1.1.0-*.aab
          if-no-files-found: error

      - name: Upload sideload test APK
        uses: actions/upload-artifact@v4
        with:
          name: noema-debug-apk-1.1.0
          path: NOEMA-TV-Speed-Limiter-1.1.0-DEBUG.apk
          if-no-files-found: error
